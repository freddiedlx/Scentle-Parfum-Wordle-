<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Aim Trainer</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #222; 
            color: white; 
            margin-top: 50px;
        }
        #gameArea { 
            width: 800px; 
            height: 500px; 
            background-color: #333; 
            margin: 20px auto; 
            position: relative; 
            border: 3px solid #555;
            border-radius: 10px;
            overflow: hidden;
            cursor: crosshair;
        }
        .target { 
            background-color: red; 
            border-radius: 50%; 
            position: absolute; 
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .stats {
            font-size: 20px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>Aim Trainer</h1>
    <div class="stats">
        Punkte: <span id="score">0</span> | Zeit: <span id="time">30</span>s
    </div>
    <button id="startBtn" onclick="startGame()">Spiel starten</button>
    
    <div id="gameArea"></div>

    <script>
        let score = 0;
        let time = 30;
        let timer;
        let totalClicks = 0;
        let targetSize = 50;
        
        const gameArea = document.getElementById("gameArea");
        const scoreDisplay = document.getElementById("score");
        const timeDisplay = document.getElementById("time");
        const startBtn = document.getElementById("startBtn");

        gameArea.onmousedown = function(e) {
            if (time > 0 && time <= 30 && startBtn.disabled) { 
                totalClicks++;
            }
            
            if (e.target.classList.contains("target")) {
                score++;
                scoreDisplay.innerText = score;
                
                if (targetSize > 10) {
                    targetSize -= 1.5; 
                }
                
                spawnTarget();
            }
        };

        function startGame() {
            score = 0;
            time = 30;
            totalClicks = 0;
            targetSize = 50;
            
            scoreDisplay.innerText = score;
            timeDisplay.innerText = time;
            gameArea.innerHTML = "";
            startBtn.disabled = true;
            
            clearInterval(timer);
            timer = setInterval(updateTime, 1000);
            
            spawnTarget();
        }

        function updateTime() {
            time--;
            timeDisplay.innerText = time;
            
            if (time <= 0) {
                clearInterval(timer);
                gameArea.innerHTML = "";
                startBtn.disabled = false;
                
                let accuracy = 0;
                if (totalClicks > 0) {
                    accuracy = Math.round((score / totalClicks) * 100);
                }
                alert("Zeit abgelaufen! Punkte: " + score + " | Trefferquote: " + accuracy + "%");
            }
        }

        function spawnTarget() {
            gameArea.innerHTML = "";
            const target = document.createElement("div");
            target.className = "target";
            
            target.style.width = targetSize + "px";
            target.style.height = targetSize + "px";
            
            const maxX = gameArea.clientWidth - targetSize;
            const maxY = gameArea.clientHeight - targetSize;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            target.style.left = randomX + "px";
            target.style.top = randomY + "px";
            
            gameArea.appendChild(target);
        }
    </script>

</body>
</html>
